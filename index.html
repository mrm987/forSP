<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 소개</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="carousel-container">
        <h1 class="title">캐릭터 소개</h1>

        <div class="carousel">
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-slide">
                    <div class="character-card">
                        <img src="13-1.png" alt="캐릭터 1">
                        <div class="character-info">
                            <h2>캐릭터 1</h2>
                            <p>첫 번째 캐릭터 소개</p>
                        </div>
                    </div>
                </div>

                <div class="carousel-slide">
                    <div class="character-card">
                        <img src="90391e0d5db83906.png" alt="캐릭터 2">
                        <div class="character-info">
                            <h2>캐릭터 2</h2>
                            <p>두 번째 캐릭터 소개</p>
                        </div>
                    </div>
                </div>

                <div class="carousel-slide">
                    <div class="character-card">
                        <img src="9a28951b49c55442.png" alt="캐릭터 3">
                        <div class="character-info">
                            <h2>캐릭터 3</h2>
                            <p>세 번째 캐릭터 소개</p>
                        </div>
                    </div>
                </div>

                <div class="carousel-slide">
                    <div class="character-card">
                        <img src="c4516e7a8fd7dbe3.png" alt="캐릭터 4">
                        <div class="character-info">
                            <h2>캐릭터 4</h2>
                            <p>네 번째 캐릭터 소개</p>
                        </div>
                    </div>
                </div>

                <div class="carousel-slide">
                    <div class="character-card">
                        <img src="d60b0a9d52816636.png" alt="캐릭터 5">
                        <div class="character-info">
                            <h2>캐릭터 5</h2>
                            <p>다섯 번째 캐릭터 소개</p>
                        </div>
                    </div>
                </div>

                <div class="carousel-slide">
                    <div class="character-card">
                        <img src="f96cf7785c6da2f0.png" alt="캐릭터 6">
                        <div class="character-info">
                            <h2>캐릭터 6</h2>
                            <p>여섯 번째 캐릭터 소개</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="carousel-button prev" id="prevBtn">&#10094;</button>
        <button class="carousel-button next" id="nextBtn">&#10095;</button>

        <div class="carousel-indicators" id="indicators"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
